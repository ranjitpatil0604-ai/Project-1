<!DOCTYPE html>
<html>
<head>
    <title>Web Security Scanner</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(270deg, #1e3c72, #2a5298);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        input {
            padding: 10px;
            width: 300px;
            border-radius: 10px;
            border: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #00c6ff;
            color: black;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h1>🔐 Web Application Security Tool</h1>

<form method="POST">
    <input type="text" name="url" placeholder="Enter URL (http://example.com)" required>
    <br><br>
    <button type="submit">Scan</button>
</form>

<div class="result">
    {% for r in result %}
        <p>{{ r }}</p>
    {% endfor %}
</div>

</body>
</html>
